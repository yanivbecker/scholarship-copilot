# CI: runs every check from the pre-commit hooks plus the test suites (NFR-9).
# Four independent jobs run in parallel; any failure marks the commit red.
name: CI

# Actions are pinned to full commit SHAs (tags can be moved; SHAs cannot).
# The trailing comment names the release each SHA belongs to.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can read the repo and nothing else.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (api/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies (exactly as locked)
        run: uv sync --locked
      - name: ruff format
        run: uv run ruff format --check .
      - name: pylint
        run: uv run pylint app tests
      - name: mypy
        run: uv run mypy app tests migrations
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: pyright (catches what mypy doesn't; uses ../pyrightconfig.json)
        working-directory: .
        run: npx --yes pyright@1.1.414 api
      - name: pytest
        run: uv run pytest
      - name: Migrations apply cleanly and match the models
        # Keep CI data in the runner's temp dir, never in the repo (NFR-1).
        # (`runner.temp` only exists at step level, not in job-level env.)
        env:
          SCHOLARSHIP_DATA_DIR: ${{ runner.temp }}/scholarship-data
        run: |
          uv run alembic upgrade head
          uv run alembic check

  frontend:
    name: Frontend (web/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies (exactly as locked)
        run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: oxlint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Production build
        run: npm run build

  api-contract:
    name: Generated API types are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
        working-directory: api
      - run: npm ci
        working-directory: web
      - name: Regenerate types from the backend
        run: npm run gen:api
        working-directory: web
      - name: Fail if they differ from what is committed
        run: |
          git diff --exit-code -- web/src/api/ || {
            echo "::error::API types are stale. Run 'npm run gen:api' in web/ and commit the result."
            exit 1
          }

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so every commit is scanned
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false' # no PR comments, so no write permission needed
