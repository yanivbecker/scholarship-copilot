# CI: runs every check from the pre-commit hooks plus the test suites (NFR-9).
# Three independent jobs run in parallel; any failure marks the commit red.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can read the repo and nothing else.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (api/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # Keep CI data in the runner's temp dir, never in the repo (NFR-1).
      SCHOLARSHIP_DATA_DIR: ${{ runner.temp }}/scholarship-data
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install dependencies (exactly as locked)
        run: uv sync --locked
      - name: ruff format
        run: uv run ruff format --check .
      - name: pylint
        run: uv run pylint app tests
      - name: mypy
        run: uv run mypy app tests migrations
      - name: pytest
        run: uv run pytest
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check

  frontend:
    name: Frontend (web/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies (exactly as locked)
        run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: oxlint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Production build
        run: npm run build

  api-contract:
    name: Generated API types are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
        working-directory: api
      - run: npm ci
        working-directory: web
      - name: Regenerate types from the backend
        run: npm run gen:api
        working-directory: web
      - name: Fail if they differ from what is committed
        run: |
          git diff --exit-code -- web/src/api/ || {
            echo "::error::API types are stale. Run 'npm run gen:api' in web/ and commit the result."
            exit 1
          }

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so every commit is scanned
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false' # no PR comments, so no write permission needed
