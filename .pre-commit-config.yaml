# Hooks run from the repo root on staged files.
# Python hooks use the api/ virtualenv via `uv run`; web hooks use web/node_modules.
repos:
  - repo: local
    hooks:
      # --- Secrets (NFR-2): runs first, on every commit, all file types ---
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
        always_run: true

      # --- GitHub Actions workflows: catch errors GitHub would reject ---
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      # --- Backend (api/) ---
      - id: ruff-format
        name: ruff format
        entry: uv run --project api ruff format
        language: system
        types: [python]
        files: ^api/
      - id: pylint
        name: pylint
        entry: uv run --project api pylint --rcfile=api/pyproject.toml
        language: system
        types: [python]
        files: ^api/
        exclude: ^api/migrations/ # Alembic-generated; pylint gives false alarms
      - id: mypy
        name: mypy
        entry: uv run --directory api mypy app tests migrations
        language: system
        types: [python]
        files: ^api/
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: npx --yes pyright@1.1.414 api
        language: system
        types: [python]
        files: ^api/
        pass_filenames: false

      # --- Frontend (web/) ---
      - id: prettier
        name: prettier
        entry: web/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^web/
        types: [text]
        # web/.prettierignore isn't read when running from the repo root, so
        # generated files are excluded here too (they must match the generator).
        exclude: ^web/(package-lock\.json|src/api/(openapi\.json|schema\.d\.ts))$
      - id: oxlint
        name: oxlint
        entry: npm --prefix web run --silent lint
        language: system
        files: ^web/
        pass_filenames: false
      - id: tsc
        name: tsc (typecheck)
        entry: npm --prefix web run --silent typecheck
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false
